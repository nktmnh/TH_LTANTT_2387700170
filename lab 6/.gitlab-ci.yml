stages:
  - test
  - security
  - build

default:
  image: python:3.13-slim
  before_script:
    - python --version

unit-tests:
  stage: test
  script:
    - python -m unittest discover -s tests -v

security-gates:
  stage: security
  script:
    - python run_security_checks.py --root . --report reports/security-report.json
  artifacts:
    when: always
    paths:
      - reports/security-report.json
    expire_in: 7 days

container-build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --pull --tag lab6-devsecops:${CI_COMMIT_SHORT_SHA} .
  rules:
    - if: $CI_COMMIT_BRANCH
